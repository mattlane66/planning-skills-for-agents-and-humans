version: 2

updates:
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/New_York
    groups:
      mcp-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /visualizer
    schedule:
      interval: weekly
      day: tuesday
      time: "06:10"
      timezone: America/New_York
    groups:
      visualizer-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: tuesday
      time: "06:20"
      timezone: America/New_York
    groups:
      site-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
      timezone: America/New_York
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:40"
      timezone: America/New_York
    groups:
      workflow-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
