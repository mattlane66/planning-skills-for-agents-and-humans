name: Regenerate Opportunity handoff derived artifacts (temporary)

on:
  push:
    branches: [docs/opportunity-underwriting-handoff]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Synchronize packaged skills
        run: bash scripts/sync-packaged-skills.sh sync

      - name: Regenerate documentation portal
        run: |
          cd site
          npm ci --ignore-scripts
          npm run build

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add \
            skills/lead-user-research/README.md \
            skills/lead-user-research/PROTOCOL.md \
            site/index.html
          if git diff --cached --quiet; then
            echo "Derived artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate opportunity handoff derived artifacts"
          git push origin HEAD:docs/opportunity-underwriting-handoff
