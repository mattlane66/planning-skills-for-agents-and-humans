name: Sync generated site once

on:
  push:
    branches:
      - fix-repo-health-v1.5.3

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Regenerate canonical standalone portal
        run: |
          cd site
          npm ci --ignore-scripts
          npm run check
      - name: Commit regenerated portal and remove one-time workflow
        run: |
          rm .github/workflows/sync-generated-site-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html .github/workflows/sync-generated-site-once.yml
          git commit -m "Regenerate standalone documentation portal"
          git push
