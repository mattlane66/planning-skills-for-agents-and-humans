name: Regenerate Lead User portal

on:
  push:
    branches:
      - lead-user-search-refinements
    paths:
      - .github/workflows/regenerate-lead-user-portal.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lead-user-search-refinements
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build portal
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Commit generated portal and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git rm .github/workflows/regenerate-lead-user-portal.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Regenerate documentation portal"
          git push origin HEAD:lead-user-search-refinements
