name: Apply usage documentation follow-up

on:
  push:
    branches:
      - docs/usage-install-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry usage docs follow-up patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Apply final usage-doc consistency fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text: {label}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/start-here.md',
              "**First make the skills available to your agent.** See [Install Planning Skills, then use them in your product repo](./install-and-use.md). Installation and invocation are separate: Claude Code's built plugin carries namespaced slash commands; Codex, uploaded Claude skills, and native Gemini Agent Skills can always invoke the same canonical skills by name in natural language. Gemini slash commands work only when the repo-local `.gemini/commands/` wrappers are actually present in the active project.",
              "**First make the skills available to your agent.** See [Install Planning Skills, then use them in your product repo](./install-and-use.md). Installation and invocation are separate: Claude Code's built plugin carries namespaced slash commands; Codex, uploaded Claude skills, and native Gemini Agent Skills can always invoke the same canonical skills by name in natural language. Gemini slash commands work only when the repo-local `.gemini/commands/` wrappers are actually present in the active project. This guide uses short wrapper names such as `/plan` and `/shape` for readability; with the installed Claude Code plugin, prefix them with `/planning-skills:` (for example, `/planning-skills:plan` and `/planning-skills:shape`).",
              'Start Here command namespace',
          )

          replace_once(
              'docs/agent-invocation-matrix.md',
              "> **Gemini column:** the slash commands below refer to this repository's `.gemini/commands/` wrappers. A native Gemini Agent Skills install by itself does not copy those commands into another project; use the Codex/plain-prompt wording unless you intentionally install/adapt the wrappers.\n",
              "> **Claude column:** the table shows the short wrapper names. With the installed Claude Code plugin, prefix them with `/planning-skills:` (`/plan` → `/planning-skills:plan`, `/shape` → `/planning-skills:shape`).\n>\n> **Gemini column:** the slash commands below refer to this repository's `.gemini/commands/` wrappers. A native Gemini Agent Skills install by itself does not copy those commands into another project; use the Codex/plain-prompt wording unless you intentionally install/adapt the wrappers.\n",
              'Invocation matrix command namespace',
          )

          replace_once(
              'docs/agent-invocation-matrix.md',
              '| Profile | Claude / Gemini | Codex / other agents |\n| --- | --- | --- |\n| Collaborative | Invoke `/shape` or canonical `shaping` and state collaborative mode; focused commands may be used in any useful order. | “Use collaborative shaping. Start from what is already concrete and keep Working material separate from Accepted intent.” |\n| Gated / orchestrated | Invoke `/shape` and explicitly request the gated profile; wrappers enforce `.agent-orchestration.yaml` prerequisites. | “Use the gated/orchestrated profile and enforce `.agent-orchestration.yaml` prerequisites.” |',
              '| Profile | Claude Code / Gemini with project wrappers | Native Gemini / Codex / other agents |\n| --- | --- | --- |\n| Collaborative | Invoke the shaping wrapper and state collaborative mode; focused wrappers may be used in any useful order. | “Use the shaping skill in collaborative mode. Start from what is already concrete and keep Working material separate from Accepted intent.” |\n| Gated / orchestrated | Invoke the shaping wrapper and explicitly request the gated profile; wrappers enforce `.agent-orchestration.yaml` prerequisites. | “Use the gated/orchestrated profile and enforce `.agent-orchestration.yaml` prerequisites.” |',
              'Invocation matrix profile mapping',
          )

          p = Path('docs/codex-plugin.md')
          text = p.read_text(encoding='utf-8')
          text, n = re.subn(
              r'(feed-planning-context/\s+-> skills/feed-planning-context/\n)(```)',
              r'\1lead-user-research/          -> skills/lead-user-research/\n\2',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('missing expected text: Codex maintenance inventory')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild standalone documentation portal
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build

      - name: Commit final documentation fixes
        shell: bash
        run: |
          set -euo pipefail
          git add docs site/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish usage documentation reconciliation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
