name: Product Intent

on:
  push:
    paths:
      - 'product-intent/**'
      - '.github/workflows/product-intent.yml'
  pull_request:
    paths:
      - 'product-intent/**'
      - '.github/workflows/product-intent.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s product-intent -p 'test_*.py' -v
      - run: python3 product-intent/intent.py validate product-intent/example.json
