name: Regenerate criterion-lineage derived artifacts

on:
  push:
    branches:
      - criterion-lineage-realized-fit

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Regenerate documentation portal
        run: |
          cd site
          npm ci --ignore-scripts
          npm run build
      - name: Refresh MCP lockfile and audit
        run: |
          cd mcp-server
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=moderate
      - name: Preserve script executability
        run: chmod +x scripts/check-golden-evals.sh
      - name: Commit derived artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html mcp-server/package-lock.json scripts/check-golden-evals.sh
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate criterion-lineage derived artifacts"
            git push origin HEAD:criterion-lineage-realized-fit
          fi
