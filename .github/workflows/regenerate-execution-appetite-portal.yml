name: One-shot portal regeneration

on:
  push:
    branches:
      - feature/execution-appetite-v1.5.0
    paths:
      - .github/workflows/regenerate-execution-appetite-portal.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/execution-appetite-v1.5.0

      - name: Set up minimum supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Regenerate tracked portal and remove helper
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm ci --ignore-scripts
          npm run build
          cd ..
          rm .github/workflows/regenerate-execution-appetite-portal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html .github/workflows/regenerate-execution-appetite-portal.yml
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate documentation portal"
          git push origin HEAD:feature/execution-appetite-v1.5.0
