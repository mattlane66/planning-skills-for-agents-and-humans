name: One-time dependency audit repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-audit-fix-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Repair portal dependency lock
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit fix --package-lock-only
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

      - name: Repair MCP dependency lock
        working-directory: mcp-server
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit fix --package-lock-only
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

      - name: Commit patched lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/package-lock.json mcp-server/package-lock.json; then
            echo "Dependency locks are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/package-lock.json mcp-server/package-lock.json
          git commit -m "Refresh audited npm dependency locks for v1.5.0"
          git push origin HEAD:main
