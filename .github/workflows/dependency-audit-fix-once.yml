name: One-time dependency audit repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-audit-fix-once.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Refresh audited transitive dependency locks
        shell: bash
        run: |
          set -euo pipefail

          (
            cd site
            npm ci --ignore-scripts
            npm audit fix --package-lock-only
            npm ci --ignore-scripts
            npm audit --audit-level=moderate
          )

          (
            cd mcp-server
            npm ci --ignore-scripts
            npm audit fix --package-lock-only
            npm ci --ignore-scripts
            npm audit --audit-level=moderate
          )

      - name: Commit repaired locks and remove this helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/package-lock.json mcp-server/package-lock.json
          git rm .github/workflows/dependency-audit-fix-once.yml

          git commit -m "Refresh audited npm dependency locks for v1.5.0"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
