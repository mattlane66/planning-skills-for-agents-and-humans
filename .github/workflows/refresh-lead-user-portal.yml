name: Refresh Lead User portal

on:
  push:
    branches:
      - feature/lead-user-research

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lead-user-research
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Rebuild committed documentation portal
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Commit generated portal if changed
        run: |
          if git diff --quiet -- site/index.html; then
            echo "Portal already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Refresh documentation portal"
          git push origin HEAD:feature/lead-user-research
