name: Grok X discovery build probe
on:
  push:
    branches: [lead-user-grok-build-probe]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run screening and Lead User regression tests
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -p 'test_lead_user*.py'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Rebuild and verify documentation
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
      - name: Commit only regenerated portal on disposable branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "lead-user-grok-build-probe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate portal for Grok X discovery"
            git push origin HEAD:refs/heads/lead-user-grok-build-probe
          fi
