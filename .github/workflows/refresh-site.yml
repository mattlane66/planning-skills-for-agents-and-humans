name: Refresh generated docs portal

on:
  push:
    branches: [lead-user-discovery-inputs]
    paths:
      - "lead-user-research/**"
      - "skills/lead-user-research/**"
      - "README.md"
      - ".github/workflows/refresh-site.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lead-user-discovery-inputs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Rebuild portal
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Commit generated portal
        run: |
          if git diff --quiet -- site/index.html; then
            echo "Portal already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Regenerate documentation portal"
          git push origin HEAD:lead-user-discovery-inputs
