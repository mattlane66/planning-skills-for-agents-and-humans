name: Board PR dependency repair
on:
  push:
    branches:
      - feature/versioned-breadboard-language
    paths:
      - .github/workflows/board-dependency-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair existing vulnerable npm lockfiles and rebuild standalone portal
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run build
          npm audit --audit-level=moderate
          cd ../mcp-server
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run check
          npm audit --audit-level=moderate
          cd ..
          node site/shaping-board/test-breadboard-core.mjs
          (cd site && node shaping-board/test-board.mjs)
      - name: Commit repaired lockfiles and generated portal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/package-lock.json site/package.json site/index.html mcp-server/package-lock.json mcp-server/package.json
          if git diff --cached --quiet; then
            echo "No dependency changes detected"
          else
            git commit -m "fix(deps): address npm security advisories blocking board merge"
            git push origin HEAD:feature/versioned-breadboard-language
          fi
