name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "templates/**"
      - "examples/**"
      - "*/SKILL.md"
      - "README.md"
      - "AGENTS.md"
      - ".agent-orchestration.yaml"
      - "skill-inventory.txt"
      - "skill-metadata.json"
      - ".github/workflows/pages.yml"
      - "scripts/capture-review-demo.mjs"
      - "scripts/build-review-demo.py"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build trusted Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Reproduce standalone portal
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          if ! git diff --exit-code -- index.html; then
            echo "::warning::Tracked site/index.html is stale; deploying the regenerated, validated portal from this trusted main commit. Repo Health continues to enforce tracked-file parity separately."
          fi

      - name: Prepare reviewer demo dependencies
        run: python3 -m pip install --disable-pip-version-check pillow imageio imageio-ffmpeg numpy

      - name: Capture live production MCP data
        env:
          PLANNING_SKILLS_MCP_URL: https://planning-skills-mcp-production.up.railway.app/mcp
        run: node scripts/capture-review-demo.mjs /tmp/planning-skills-review-demo-data.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage exact tracked site and reviewer demo
        run: |
          set -euo pipefail
          mkdir -p /tmp/planning-skills-pages/review /tmp/planning-skills-pages/product-ontology
          cp site/index.html /tmp/planning-skills-pages/index.html
          # Derived from accepted canonical example on trusted main, not hand-written demo state.
          python3 scripts/publish-shaped-work.py \
            --planning-dir examples/simple-grocery-list \
            --output /tmp/planning-skills-pages/product-ontology/shaped-work.html \
            --ontology-output /tmp/planning-skills-pages/product-ontology/index.html
          cp -R site/fit-check-error-model /tmp/planning-skills-pages/fit-check-error-model
          cp -R site/privacy /tmp/planning-skills-pages/privacy
          cp -R site/terms /tmp/planning-skills-pages/terms
          cp site/review/index.html /tmp/planning-skills-pages/review/index.html
          python3 scripts/build-review-demo.py /tmp/planning-skills-review-demo-data.json /tmp/planning-skills-pages/review

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: /tmp/planning-skills-pages

  deploy:
    name: Deploy trusted Pages artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy trusted Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
