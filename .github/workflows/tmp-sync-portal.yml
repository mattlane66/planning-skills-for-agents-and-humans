name: Temporary portal sync

on:
  push:
    branches:
      - method/operating-model-conformance-effect

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: method/operating-model-conformance-effect
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Regenerate standalone portal
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Commit generated portal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate standalone docs portal"
          git push origin HEAD:method/operating-model-conformance-effect
