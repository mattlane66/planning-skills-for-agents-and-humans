name: One-time v1.5.1 portal refresh

on:
  push:
    branches: [release/v1-5-1-execution-appetite-gate]
    paths:
      - ".github/workflows/refresh-v1-5-1-portal-once.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Regenerate standalone portal
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm ci --ignore-scripts
          npm run build

      - name: Commit portal and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git rm .github/workflows/refresh-v1-5-1-portal-once.yml
          git commit -m "Regenerate v1.5.1 documentation portal"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:release/v1-5-1-execution-appetite-gate
