name: One-time planning portal refresh
on:
  push:
    branches: [feature/planning-change-reconciliation-20261014]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'mattlane66/planning-skills-for-agents-and-humans' && github.actor == 'mattlane66'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Regenerate checked-in self-contained portal and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm ci --ignore-scripts
          npm run build
          cd ..
          git add site/index.html
          git rm .github/workflows/refresh-portal-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(site): refresh generated portal for reconciliation skill"
          git push origin HEAD:feature/planning-change-reconciliation-20261014
