name: Temporary site regeneration

on:
  push:
    branches:
      - fix-repo-health-v1.5.3

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-repo-health-v1.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Regenerate tracked standalone portal
        run: |
          set -euo pipefail
          cd site
          npm ci --ignore-scripts
          npm run build
          cd ..
          if git diff --quiet -- site/index.html; then
            echo "site/index.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Regenerate documentation portal"
          git push origin HEAD:fix-repo-health-v1.5.3
