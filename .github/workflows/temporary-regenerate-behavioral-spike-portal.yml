# Temporary feature-branch utility; removed before PR merge.
name: Temporary feature portal refresh
on:
  push:
    branches:
      - feature/optional-behavioral-spikes-20261021
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate portal and commit tracked artifact on feature branch only
        run: |
          set -euo pipefail
          cd site
          npm ci --ignore-scripts
          npm run build
          cd ..
          if ! git diff --quiet -- site/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/index.html
            git commit -m "Regenerate standalone portal for behavioral spike guidance"
            git push origin HEAD:refs/heads/feature/optional-behavioral-spikes-20261021
          fi
