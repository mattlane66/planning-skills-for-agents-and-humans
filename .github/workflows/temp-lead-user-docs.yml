name: Temporary Lead User docs regeneration

on:
  push:
    branches: [lead-user-operational-hardening]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: lead-user-operational-hardening

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Regenerate documentation portal
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm ci --ignore-scripts
          npm run build
          cd ..
          if git diff --quiet -- site/index.html; then
            echo "Documentation portal already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Regenerate documentation portal"
          git push origin HEAD:lead-user-operational-hardening
