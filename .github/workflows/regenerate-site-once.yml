name: One-time portal regeneration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-site-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Regenerate tracked portal
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build

      - name: Commit generated portal
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/index.html; then
            echo "Portal is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Regenerate documentation portal for v1.5.0"
          git push origin HEAD:main
