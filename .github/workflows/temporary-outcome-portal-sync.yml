name: Temporary portal regeneration for outcome benchmark PR
on:
  push:
    branches:
      - feature/outcome-benchmarks-v1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/outcome-benchmarks-v1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Regenerate offline portal
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: Commit generated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate offline portal for outcome benchmark'
            git push origin HEAD:feature/outcome-benchmarks-v1
          fi
