name: Refresh Hono lock

on:
  push:
    branches:
      - fix/lead-user-package-phase-f-boundary

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lead-user-package-phase-f-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Refresh Hono within existing dependency range
        working-directory: mcp-server
        run: npm update hono --package-lock-only --ignore-scripts
      - name: Verify only the lockfile changed
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "mcp-server/package-lock.json"
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp-server/package-lock.json
          git commit -m "Refresh Hono lockfile for current advisories"
          git push
