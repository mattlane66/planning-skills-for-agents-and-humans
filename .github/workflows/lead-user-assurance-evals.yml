name: Lead User v1.7 runtime assurance

on:
  workflow_dispatch:
    inputs:
      adapter_command:
        description: Command implementing the blind artifact adapter
        required: true
        type: string
      runtime:
        description: Runtime name
        required: true
        type: string
      runtime_version:
        description: Runtime version
        required: true
        type: string
      model:
        description: Model identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lead-user-assurance-${{ github.ref }}-${{ inputs.runtime }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run blind artifact assurance
        env:
          ADAPTER_COMMAND: ${{ inputs.adapter_command }}
          EVAL_RUNTIME: ${{ inputs.runtime }}
          EVAL_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          EVAL_MODEL: ${{ inputs.model }}
          PLANNING_SKILLS_EVAL_API_KEY: ${{ secrets.PLANNING_SKILLS_EVAL_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/run-lead-user-assurance-evals.py \
            --adapter command \
            --adapter-command "$ADAPTER_COMMAND" \
            --runtime "$EVAL_RUNTIME" \
            --runtime-version "$EVAL_RUNTIME_VERSION" \
            --model "$EVAL_MODEL" \
            --commit-sha "$GITHUB_SHA" \
            --adapter-timeout-seconds 900 \
            --artifacts-dir evals/artifacts/lead-user-runtime \
            --report evals/reports/lead-user-runtime-report.json

      - name: Upload assurance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lead-user-assurance-${{ github.run_id }}
          path: |
            evals/reports/lead-user-runtime-report.json
            evals/artifacts/lead-user-runtime/
          if-no-files-found: warn
          retention-days: 30
