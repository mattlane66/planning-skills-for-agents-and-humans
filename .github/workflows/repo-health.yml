name: Repo health

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            site/package-lock.json
            visualizer/package-lock.json

      - name: Build and validate Claude upload skills
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/build_claude_skills.py 2>&1 | tee claude-skill-build.log

      - name: Upload Claude skill diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-skill-build-log
          path: claude-skill-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Check repository health
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-repo-health.sh 2>&1 | tee repo-health.log

      - name: Upload repository health diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-health-log
          path: repo-health.log
          if-no-files-found: error
          retention-days: 7

  release-install-smoke:
    name: Release install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build deterministic release assets
        run: python3 scripts/release.py assets

      - name: Exercise fresh install surfaces
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$(python3 scripts/release.py version)"
          python3 scripts/check-release-install.py \
            --assets-dir dist/release \
            --release-tag "$RELEASE_TAG" \
            --release-sha "$GITHUB_SHA" \
            --report release-install-report.json

      - name: Upload install report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-install-report
          path: release-install-report.json
          if-no-files-found: error
          retention-days: 7

  site-node-floor:
    name: Site on minimum supported Node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and test documentation portal
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check

      - name: Verify tracked standalone portal is current
        id: portal-drift
        working-directory: site
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- index.html; then
            git diff -- index.html > ../site-index.patch
            exit 1
          fi

      - name: Upload regenerated portal diagnostics
        if: failure() && steps.portal-drift.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-site-index
          path: |
            site/index.html
            site-index.patch
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Real browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install portal dependencies
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Run direct-file real-browser smoke
        working-directory: site
        env:
          CHROME_BIN: google-chrome
        run: npm run test:browser
