name: Repo health

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repo-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            site/package-lock.json
            visualizer/package-lock.json

      - name: Regenerate documentation portal on same-repo PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          cd site
          npm ci
          npm run build
          cd ..
          if ! git diff --quiet -- site/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/index.html
            git commit -m "Regenerate documentation portal"
            git push origin HEAD:refs/heads/${{ github.head_ref }}
          fi

      - name: Build and validate Claude upload skills
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/build_claude_skills.py 2>&1 | tee claude-skill-build.log

      - name: Upload Claude skill diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-skill-build-log
          path: claude-skill-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Check repository health
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-repo-health.sh 2>&1 | tee repo-health.log

      - name: Upload repository health diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-health-log
          path: repo-health.log
          if-no-files-found: error
          retention-days: 7
