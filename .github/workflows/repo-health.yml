name: Repo health

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            visualizer/package-lock.json

      - name: Build and validate Claude upload skills
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/build_claude_skills.py 2>&1 | tee claude-skill-build.log

      - name: Upload Claude skill diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: claude-skill-build-log
          path: claude-skill-build.log

      - name: Check repository health
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-repo-health.sh 2>&1 | tee repo-health.log

      - name: Upload repository health diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repo-health-log
          path: repo-health.log
