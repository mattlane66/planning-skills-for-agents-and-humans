name: Temporary portal regeneration

on:
  push:
    branches:
      - "fix/repo-health-semantic-gaps"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/repo-health-semantic-gaps
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Regenerate portal
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_CACHE="${RUNNER_TEMP}/planning-skills-npm-cache"
          (
            cd site
            npm ci --ignore-scripts
            npm run build
          )

      - name: Commit generated portal
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/index.html; then
            echo "Portal is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Regenerate documentation portal"
          git push origin HEAD:fix/repo-health-semantic-gaps
