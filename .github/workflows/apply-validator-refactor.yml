name: Clean validator staging

on:
  push:
    branches: [refactor/lead-user-validator-schema-state]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove temporary payload files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05 06 07 08; do
            path=".tmp-validator-payload/part${i}"
            sha="$(gh api "repos/${{ github.repository }}/contents/${path}?ref=${{ github.ref_name }}" --jq .sha)"
            gh api --method DELETE "repos/${{ github.repository }}/contents/${path}" \
              -f message="Remove temporary validator payload" \
              -f sha="$sha" \
              -f branch="${{ github.ref_name }}" >/dev/null
          done
