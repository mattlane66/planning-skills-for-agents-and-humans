name: Temporary CodeQL findings triage
on:
  push:
    branches:
      - security/triage-codeql-v1.7.1
permissions:
  contents: read
  checks: read
  security-events: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      security-events: read
    steps:
      - name: Checkout repository for tracing generated code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect code scanning alert locations and crypto uses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'Alerts 105-107:'
          for number in 105 106 107; do
            gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts/$number" \
              --jq '{number: .number, rule: .rule.id, severity: .rule.security_severity_level, tool: .tool.name, location: .most_recent_instance.location, message: .most_recent_instance.message, tags: .rule.tags}'
          done
          echo 'Generated-line context:'
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path("site/index.html").read_text().splitlines()
          print("Total lines:",len(lines))
          for index in range(9758,min(9768,len(lines))):
              line=lines[index]
              print(f"line={index+1} characters={len(line)} begins={line[:180]!r}")
              if index==9763:
                  for pattern in (r"getRandomValues",r"randomBytes",r"randomUUID",r"crypto",r"Math\.random",r"Math\.floor",r"\.random\("):
                      hits=list(re.finditer(pattern,line))
                      print(f"  token={pattern} count={len(hits)}")
                      for hit in hits[:12]:
                          s=hit.start()
                          print(f"  at {s}: {line[max(0,s-160):min(len(line),s+180)]!r}")
          PY
