name: Regenerate Portal After Dependency Refresh

on:
  pull_request:
    paths:
      - ".github/workflows/regenerate-portal-after-deps.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Regenerate standalone portal
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check

      - name: Commit regenerated portal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if git diff --cached --quiet; then
            echo "Portal already current."
          else
            git commit -m "Regenerate portal after dependency refresh"
            git push origin HEAD:${{ github.head_ref }}
          fi
