name: Look observation bridge

on:
  push:
    paths:
      - "look/**"
      - ".github/workflows/look.yml"
  pull_request:
    paths:
      - "look/**"
      - ".github/workflows/look.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Look MCP bridge and tests
        run: npm --prefix look run check
