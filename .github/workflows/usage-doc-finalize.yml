name: Finalize usage documentation audit

on:
  push:
    branches:
      - docs/usage-install-audit

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run secondary usage docs cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Fix secondary runtime invocation docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text: {label}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/dumplink-usage.md',
              '''Claude Code:\n\n```text\n/dumplink planning/shaping.md planning/breadboard.md "Project: accepted onboarding project; Appetite: 4 weeks"\n```\n\nGemini CLI:\n\n```text\n/dumplink planning/shaping.md planning/breadboard.md "Project: accepted onboarding project; Appetite: 4 weeks"\n```''',
              '''Claude Code with the installed plugin:\n\n```text\n/planning-skills:dumplink planning/shaping.md planning/breadboard.md "Project: accepted onboarding project; Appetite: 4 weeks"\n```\n\nWhen the repo-local `.gemini/commands/` wrappers are present, Gemini CLI can use:\n\n```text\n/dumplink planning/shaping.md planning/breadboard.md "Project: accepted onboarding project; Appetite: 4 weeks"\n```\n\nA native Gemini Agent Skills install does not install that wrapper. In that case, use the same natural-language skill request shown for Codex below.''',
              'Dumplink invocation forms',
          )

          replace_once(
              'docs/statechart-usage.md',
              '''Claude Code:\n\n```text\n/statechart planning/breadboard.md "Scope: V2 retry and cancellation"\n```\n\nGemini CLI:\n\n```text\n/statechart planning/breadboard.md "Scope: V2 retry and cancellation"\n```''',
              '''Claude Code with the installed plugin:\n\n```text\n/planning-skills:statechart planning/breadboard.md "Scope: V2 retry and cancellation"\n```\n\nWhen the repo-local `.gemini/commands/` wrappers are present, Gemini CLI can use:\n\n```text\n/statechart planning/breadboard.md "Scope: V2 retry and cancellation"\n```\n\nA native Gemini Agent Skills install does not install that wrapper. In that case, use the same natural-language skill request shown for Codex or another agent below.''',
              'Statechart invocation forms',
          )

          replace_once(
              'lead-user-research/references/phase-handoff.md',
              '''Cross-platform invocation:\n\n- Claude Code and Gemini CLI: name the corresponding `/lead-user-*` command.\n- Codex and skill-capable agents: name `lead-user-research`, the next phase, and\n  the workspace.\n- Plain chat: name the phase and provide the portable prompt continuation.''',
              '''Cross-platform invocation:\n\n- Claude Code with the installed Planning Skills plugin: use the corresponding namespaced `/planning-skills:lead-user-*` command.\n- Gemini CLI: use `/lead-user-*` only when the repo-local `.gemini/commands/` wrappers are present; a native Agent Skills install should name `lead-user-research`, the next phase, and the workspace in natural language.\n- Codex and other skill-capable agents: name `lead-user-research`, the next phase, and the workspace.\n- Plain chat: name the phase and provide the portable prompt continuation.''',
              'Lead User cross-platform invocation',
          )

          replace_once(
              'docs/claude-design-workflow.md',
              'Claude Code also provides shorter command wrappers such as `/plan`, `/frame`, `/shape`, `/criteria`, `/appetite`, `/sketch-shapes`, `/fit-check`, `/spike`, `/select-shape`, `/breadboard`, and `/check-drift`. These wrappers expose focused moves within the canonical skills; they are not separate uploaded Claude skills.',
              'This repository provides short Claude Code wrappers such as `/plan`, `/frame`, `/shape`, `/criteria`, `/appetite`, `/sketch-shapes`, `/fit-check`, `/spike`, `/select-shape`, `/breadboard`, and `/check-drift`. Inside this repository those names are unqualified; with the installed Planning Skills plugin they are namespaced as `/planning-skills:<name>`. These wrappers expose focused moves within the canonical skills; they are not separate uploaded Claude skills.',
              'Claude Design wrapper namespace',
          )
          PY

      - name: Sync generated skill copies
        run: bash scripts/sync-packaged-skills.sh

      - name: Rebuild standalone documentation portal
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build

      - name: Commit secondary cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add docs lead-user-research skills site/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clarify secondary runtime invocation docs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
