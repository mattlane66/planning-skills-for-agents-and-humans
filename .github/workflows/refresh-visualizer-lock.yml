name: Refresh visualizer lockfile

on:
  push:
    branches:
      - agent/add-execution-graph
    paths:
      - .github/workflows/refresh-visualizer-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-execution-graph
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: visualizer/package-lock.json
      - name: Refresh patched visualizer dependencies
        working-directory: visualizer
        run: |
          npm install mermaid@11.16.1 --save-exact
          npm audit fix
          npm audit
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visualizer/package.json visualizer/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh visualizer security dependencies"
          git push origin HEAD:agent/add-execution-graph
