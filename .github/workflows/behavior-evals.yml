name: Real runtime behavior evaluations

on:
  workflow_dispatch:
    inputs:
      adapter_command:
        description: Command that implements the blind adapter protocol
        required: true
        type: string
      runtime:
        description: Runtime name
        required: true
        type: string
      runtime_version:
        description: Runtime version
        required: true
        type: string
      model:
        description: Model identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: behavior-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run blind behavior matrix
        env:
          ADAPTER_COMMAND: ${{ inputs.adapter_command }}
          EVAL_RUNTIME: ${{ inputs.runtime }}
          EVAL_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          EVAL_MODEL: ${{ inputs.model }}
          PLANNING_SKILLS_EVAL_API_KEY: ${{ secrets.PLANNING_SKILLS_EVAL_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/run-skill-behavior-evals.py \
            --adapter command \
            --adapter-command "$ADAPTER_COMMAND" \
            --runtime "$EVAL_RUNTIME" \
            --runtime-version "$EVAL_RUNTIME_VERSION" \
            --model "$EVAL_MODEL" \
            --commit-sha "$GITHUB_SHA" \
            --report evals/reports/runtime-report.json

      - name: Upload behavior report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: behavior-eval-${{ github.run_id }}
          path: evals/reports/runtime-report.json
          if-no-files-found: warn
          retention-days: 30
