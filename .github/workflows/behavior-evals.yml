name: Real runtime behavior evaluations

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Supported runtime to exercise
        required: true
        type: choice
        options:
          - claude-code
          - codex
          - gemini-cli
      runtime_version:
        description: Exact CLI package version to install
        required: true
        type: string
      model:
        description: Model identifier to exercise
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: behavior-evals-${{ github.ref }}-${{ inputs.runtime }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install exact runtime CLI
        env:
          EVAL_RUNTIME: ${{ inputs.runtime }}
          EVAL_RUNTIME_VERSION: ${{ inputs.runtime_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EVAL_RUNTIME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "runtime_version must be an exact npm package version, not a tag or range: $EVAL_RUNTIME_VERSION" >&2
            exit 2
          fi
          case "$EVAL_RUNTIME" in
            claude-code)
              package="@anthropic-ai/claude-code"
              binary="claude"
              ;;
            codex)
              package="@openai/codex"
              binary="codex"
              ;;
            gemini-cli)
              package="@google/gemini-cli"
              binary="gemini"
              ;;
            *)
              echo "Unsupported runtime: $EVAL_RUNTIME" >&2
              exit 2
              ;;
          esac
          npm install --global "${package}@${EVAL_RUNTIME_VERSION}"
          "$binary" --version | tee runtime-version.txt
          test -s runtime-version.txt

      - name: Run blind behavior matrix
        env:
          EVAL_RUNTIME: ${{ inputs.runtime }}
          EVAL_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          EVAL_MODEL: ${{ inputs.model }}
          PLANNING_SKILLS_EVAL_API_KEY: ${{ secrets.PLANNING_SKILLS_EVAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-skill-behavior-evals.py \
            --adapter command \
            --adapter-command "python3 adapters/runtime_case_adapter.py" \
            --runtime "$EVAL_RUNTIME" \
            --runtime-version "$EVAL_RUNTIME_VERSION" \
            --model "$EVAL_MODEL" \
            --commit-sha "$GITHUB_SHA" \
            --adapter-timeout-seconds 900 \
            --artifacts-dir evals/artifacts/runtime \
            --report evals/reports/runtime-report.json

      - name: Upload behavior report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: behavior-eval-${{ inputs.runtime }}-${{ github.run_id }}
          path: |
            runtime-version.txt
            evals/reports/runtime-report.json
            evals/artifacts/runtime/
          if-no-files-found: warn
          retention-days: 30
