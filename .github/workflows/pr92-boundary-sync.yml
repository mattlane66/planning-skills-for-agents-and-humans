name: PR 92 boundary sync

on:
  push:
    branches:
      - fix/lead-user-package-phase-f-boundary

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lead-user-package-phase-f-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Reconcile boundary and regenerate portal
        run: python .github/pr92_boundary_sync.py
      - name: Commit synchronized outputs
        run: |
          rm .github/pr92_boundary_sync.py .github/workflows/pr92-boundary-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile Lead User planning handoff boundary'
          git push origin HEAD:fix/lead-user-package-phase-f-boundary
