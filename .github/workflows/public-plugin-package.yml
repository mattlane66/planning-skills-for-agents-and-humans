name: Public Plugin Package

on:
  pull_request:
    paths:
      - "plugin.json"
      - "mcp.json"
      - ".codex-plugin/plugin.json"
      - "assets/**"
      - "skills/**"
      - "templates/**"
      - "docs/**"
      - "AGENTS.md"
      - ".agent-orchestration.yaml"
      - "LICENSE"
      - "scripts/build-public-plugin.sh"
      - ".github/workflows/public-plugin-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and validate public plugin ZIP
        run: bash scripts/build-public-plugin.sh
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-plugin-package
          path: |
            dist/openai-public-plugin/*.zip
            dist/openai-public-plugin/*.sha256
          if-no-files-found: error
          retention-days: 7
