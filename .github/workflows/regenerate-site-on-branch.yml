name: Regenerate site once

on:
  push:
    branches: [product-intent-layer]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: product-intent-layer
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Regenerate standalone portal
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: Commit generated portal
        run: |
          if git diff --quiet -- site/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Regenerate documentation portal"
          git push origin HEAD:product-intent-layer
