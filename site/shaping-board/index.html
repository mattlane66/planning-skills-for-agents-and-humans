<!DOCTYPE html>

<title>Shaping board</title>
<style>

textarea{resize:vertical}.dsl{font:12px/1.4 ui-monospace,monospace;min-height:220px}
.wrap{flex:1;display:flex;min-height:0}
aside{width:390px;flex:none;border-right:1px solid var(--bd);overflow:auto;padding:14px}
main{flex:1;overflow:auto;padding:14px 18px;min-width:0}

 });

 array(raw.reqs,"reqs").forEach((r,i)=>{

function bridgeEntries(section){

   const previous=bridgeValue(M,key),proposed=bridgeValue(B.proposal,key);
   if(JSON.stringify(previous)===JSON.stringify(proposed))continue;
   const stable=key==="options"||key==="reqs"||key==="stories"||key==="things";
   const a=Array.isArray(previous)?previous:null,b=Array.isArray(proposed)?proposed:null;
   if(stable&&a&&b&&a.every(row=>row&&typeof row.id==="string")&&b.every(row=>row&&typeof row.id==="string")
      &&new Set(a.map(row=>row.id)).size===a.length&&new Set(b.map(row=>row.id)).size===b.length){
     const before=new Map(a.map(row=>[row.id,row])),after=new Map(b.map(row=>[row.id,row]));
     for(const id of new Set([...before.keys(),...after.keys()])){
       const left=before.get(id),right=after.get(id);
       if(JSON.stringify(left)!==JSON.stringify(right)){
         result.push({label:key+" · "+id,previous:left,proposed:right});

     }

       result.push({label:key+" · record order",previous:a.map(row=>row.id),proposed:b.map(row=>row.id)});
   }else result.push({label:key,previous,proposed});

 if(a==="bb-proposal"){$("#imp-breadboard-patch").click();return false}
  if(a==="bb-discard"){B.patch=null;T.msg="Typed patch discarded";return true}

  if(a==="bridge-proposal"){$("#imp-proposal").click();return false}
 if(a==="bridge-package"){dl(slug()+"-ai-workspace.zip",zip(bridgePackageFiles()),"application/zip");return false}
 if(a==="bridge-prompt"){dl(slug()+"-ai-instruction.txt",bridgePrompt(),"text/plain");return false}
 if(a==="bridge-copy"){try{Promise.resolve(navigator.clipboard.writeText(bridgePrompt())).then(()=>{T.msg="AI instruction copied";render()}).catch(()=>{T.msg="Clipboard blocked: use Download instruction";render()})}catch(_){T.msg="Clipboard blocked: use Download instruction";render()}return false}
 if(a==="bridge-discard"){B.proposal=null;T.msg="Proposal discarded";return true}
 if(a.startsWith("bridge-apply-")){try{bridgeApply(a.slice(13))}catch(ex){T.msg="Cannot apply proposal: "+ex.message}return true}
 if(a==="imp"){$("#imp").click();return false}
 if(a==="imp-status"){$("#imp-status").click();return false}
 if(a==="feed-connect"){try{
 const url=document.querySelector("[data-feed-url]").value.trim(),repo=document.querySelector("[data-feed-repo]").value.trim(),ref=document.querySelector("[data-feed-ref]").value.trim()||"main";
 M.status_feed=checkFeedConfig(url,repo,ref);M.product_status=null;save();refreshStatusFeed();
 }catch(error){T.msg=String(error.message||error)}return true}
 if(a==="feed-refresh"){refreshStatusFeed();return false}
 if(a==="feed-disconnect"){delete M.status_feed;M.product_status=null;resetStatusFeed();T.msg="Status feed disconnected";return true}
 if(a==="clear-status"){if(M.status_feed){T.msg="Disconnect the feed to clear automatic evidence";return true}M.product_status=null;T.msg="Imported evidence cleared";return true}
 if(a==="exp"){const {product_status:localEvidence,status_feed:localFeed,...portable}=M;dl(slug()+".board.json",JSON.stringify(portable,null,2),"application/json");return false}
 if(a==="md"){dl(slug()+"-shape.md",notes(),"text/markdown");return false}
 if(a==="zip"){dl(slug()+"-planning.zip",zip(planningFiles()),"application/zip");return false}
 if(a==="copy"){try{navigator.clipboard.writeText(notes());T.msg="Copied"}catch(_){T.msg="Copy blocked here; use Download"}}
 if(a==="new"){B.proposal=null;B.patch=null;save();T.undo=clone(M);M=norm(blank());M.project_id=makeProjectId();resetStatusFeed();T.top="shape";T.sub="board";T.opt=0;T.story=T.rq=null}
 if(a==="ex"){B.proposal=null;B.patch=null;save();T.undo=clone(M);M=norm(clone(E));M.project_id=makeProjectId();resetStatusFeed();T.top="shape";T.sub="board";T.opt=0;T.story=T.rq=null}
 if(a==="undo"&&T.undo){M=T.undo;T.undo=null;T.opt=0;T.story=T.rq=null}
 if(a==="seed"&&k>=0)parse(M.options[k].dsl).nodes.forEach(n=>{const it=n.i+" · "+n.t;if(!M.drift.some(r=>r.item===it))M.drift.push({item:it,intent:n.k+(n.r.length?": "+n.r.join("; "):""),reality:"",status:"not checked"})});
 if(a==="seed"&&k<0)T.msg="Select a direction first";
 if(a==="sync")[...M.reqs].sort((x,y)=>y.star-x.star).forEach(r=>{if(!M.rel.some(x=>x.req===r.text))M.rel.push({req:r.text,check:r.chk||"",status:"not verified",evidence:""})});
 return true}
document.addEventListener("click",e=>{const t=e.target.closest("[data-top],[data-sub],[data-view],[data-opt],[data-addopt],[data-delopt],[data-story],[data-dot],[data-star],[data-rq],[data-rate],[data-pick],[data-add],[data-del],[data-z],[data-act],[data-addreq],[data-accept],[data-impact-rq],[data-ontology-rq]");if(!t)return;const d=t.dataset;T.msg="";
 if(d.top)T.top=d.top;if(d.ontologyRq!==undefined){T.top="shape";T.sub="board";T.view="fit";T.rq=+d.ontologyRq;}if(d.sub)T.sub=d.sub;if(d.view)T.view=d.view;if(d.opt!==undefined)T.opt=+d.opt;
 if(d.addopt!==undefined){addOpt();M.selectionAuthority="Working"}if(d.delopt!==undefined){delOpt();M.selectionAuthority="Working"}
 if(d.story!==undefined)T.story=T.story===+d.story?null:+d.story;
 if(d.dot){const[i,j]=d.dot.split(",").map(Number),s=M.stories[i],c="10x"[("10x".indexOf(s.fit[j])+1)%3];s.fit=s.fit.slice(0,j)+c+s.fit.slice(j+1);M.selectionAuthority="Working"}
 if(d.star!==undefined)M.reqs[+d.star].star=!M.reqs[+d.star].star;
 if(d.rq!==undefined)T.rq=T.rq===+d.rq?null:+d.rq;if(d.impactRq!==undefined){T.top="shape";T.sub="board";T.view="fit";T.rq=+d.impactRq;}
 if(d.rate){const[i,j]=d.rate.split(",").map(Number),r=M.reqs[i],c="ypnu"[("ypnu".indexOf(r.f[j])+1)%4];r.f=r.f.slice(0,j)+c+r.f.slice(j+1);M.selectionAuthority="Working"}
 if(d.pick){M.pick=M.pick===d.pick?null:d.pick;M.selectionAuthority="Working"}if(d.accept!==undefined){const issues=decisionIssues();if(issues.length){T.msg="Selection blocked: "+issues[0]}else{M.selectionAuthority="Accepted";T.msg="Human selection recorded"}}
 if(d.add){M[d.add].push(TPL[d.add]());if(["stories","slices"].includes(d.add))M.selectionAuthority="Working"}
 if(d.del){const[k,i]=d.del.split(".");M[k].splice(+i,1);if(["reqs","stories","slices"].includes(k))M.selectionAuthority="Working";if(k==="reqs")T.rq=null;if(k==="stories")T.story=null}
 if(d.z)T.zm=Math.max(.5,Math.min(2,T.zm+.25*d.z));
 if(d.addreq!==undefined&&T.nr.trim()){M.selectionAuthority="Working";const n=M.options.length;M.reqs.push({id:"R"+(Math.max(0,...M.reqs.map(r=>+(r.id||"").replace(/\D/g,"")||0))+1),status:"Undecided",auth:"Working",text:T.nr.trim(),src:"",why:"",chk:"",star:false,f:"u".repeat(n),l:Array(n).fill("")});T.nr=""}
 if(d.act&&!act(d.act))return;save();render()});
document.addEventListener("input",e=>{const el=e.target,d=el.dataset;if(d.agentInstruction!==undefined){Agent.instruction=el.value;return}if(d.nr!==undefined){T.nr=el.value;return}
 if(el.type==="checkbox"||el.tagName==="SELECT")return;
 if(d.l){M[d.l]=el.value.split("\n").map(s=>s.trim()).filter(Boolean);M.selectionAuthority="Working";save();return}
 if(d.p){set(d.p,el.value);if(d.p!=="name")M.selectionAuthority="Working";save();if(/\.(dsl|path|l\.\d+)$/.test(d.p))renderDia()}});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.project!==undefined){const next=projects[el.value];if(next){B.proposal=null;B.patch=null;save();try{M=norm(clone(next));T.opt=0;T.rq=T.story=null;save();refreshStatusFeed()}catch(_){T.msg="Saved project is invalid"}render()}return}if(el.dataset.p&&(el.type==="checkbox"||el.tagName==="SELECT")){set(el.dataset.p,el.type==="checkbox"?el.checked:el.value);M.selectionAuthority="Working";save();render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.nr!==undefined)$("[data-addreq]").click();if((e.key==="Enter"||e.key===" ")&&e.target.matches(".opt,.tabs span")){e.preventDefault();e.target.click()}});
$("#imp").addEventListener("change",e=>{const f=e.target.files[0];if(f)f.text().then(x=>{try{const m=JSON.parse(x);if(!Array.isArray(m.options)||!m.options.length||f.size>1024*1024)throw 0;save();T.undo=clone(M);M=norm(m);B.proposal=null;B.patch=null;delete M.status_feed;delete M.product_status;M.project_id=M.project_id||makeProjectId();T.opt=T.story=T.rq=null;resetStatusFeed();save();refreshStatusFeed()}catch(_){T.msg="That file isn't a board export"}render()});e.target.value=""});
$("#imp-status").addEventListener("change",e=>{const file=e.target.files[0];if(file)file.text().then(content=>{try{if(file.size>1024*1024)throw Error("File too large");const value=JSON.parse(content);if(value.schema_version!==1||value.kind!=="ShapingBoardProductStatus"||!["PASS","REVIEW","DRIFT"].includes(value.verdict)||!Array.isArray(value.impacts)||value.impacts.length>500)throw Error("Not a Product Intent board report");resetStatusFeed();delete M.status_feed;M.product_status=value;T.top="review";T.msg="Read-only Product Intent report imported";save()}catch(ex){T.msg="Could not import status: "+ex.message}render()});e.target.value=""});

document.addEventListener("change",e=>{
 const d=e.target.dataset||{};
 if(d.bridgeProvider!==undefined&&BRIDGE_PROVIDERS[e.target.value]){B.provider=e.target.value;render();}
 if(d.bridgeTask!==undefined&&BRIDGE_TASKS[e.target.value]){B.task=e.target.value;render();}
});

$("#imp-breadboard-patch").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(file){
  if(file.size>1024*1024){T.msg="Patch exceeds 1 MiB";render()}
  else file.text().then(content=>{try{
   const value=JSON.parse(content);breadboardPatchPreview(value);
   B.patch=value;T.top="workspace";T.msg="Typed patch loaded for review; nothing applied";
  }catch(error){T.msg="Cannot review patch: "+error.message}render()}).catch(()=>{T.msg="Unable to read patch";render()});
 }
 e.target.value="";
});
$("#imp-proposal").addEventListener("change",e=>{
 const f=e.target.files[0];
 if(f){
   if(f.size>1024*1024){T.msg="Proposal exceeds 1 MiB";render();}
   else f.text().then(content=>{try{
     const parsed=JSON.parse(content);
     if(parsed.schema_version!==3||!parsed.project_id||parsed.project_id!==M.project_id)throw Error("This is not a schema v3 revision of the current Board project");
     const proposed=bridgeValidateProposal(parsed);
     B.proposal=proposed;T.top="workspace";T.msg="Proposal loaded for review; no changes applied";
   }catch(ex){T.msg="Could not review proposal: "+ex.message;}render();}).catch(()=>{T.msg="Unable to read proposal";render();});
 }
 e.target.value="";
});
