uest form | send a request | app | @20,60,200,80\nP2 | place | My requests | where each stands, and why; answer a question | app | @20,230,200,96\nP3 | place | Review board | requests to decide; open a request | app | @280,56,200,112\nP6 | place | A request · review | the ask, the thread; ask a question; approve: what's in and out; decline: say why | app | @540,56,210,150\nO1 | action | approve | request → work item | app | @810,60,200,56\nP9 | place | Claim board | approved work, who's on what; open an item | app | @1070,56,220,112\nQ2 | question | claimed? | | app | @1330,50,130,96\nO2 | action | tell the requester | status + an email | app | @1070,250,230,56\nP4 | place | Work item · nobody on it | what's in and out; claim it; do it, propose an MR | app | @250,470,230,112\nP7 | place | Work item · yours | what's in and out; its MRs, App and BackEnd; work on it in GitLab | app | @540,470,190,112\nP5 | place | Work item · taken | what's in and out, who has it; ask to take it; do it, propose an MR | app | @250,660,230,112\nP8 | place | App + BackEnd MRs | pipeline result; open an MR naming DWC-42 | GitLab | @800,470,200,96\nQ1 | question | approved? | | GitLab | @1040,470,130,96\nO3 | action | merge | MR → merged, item done | GitLab | @1230,480,210,56\nP1 -> P3 : send\nP3 -> P6 : click\nP6 -> O1 : approve\nP6 -> O2 : ask\nO1 -> P9\nO2 -> P2 : updated · emailed ~ M 1185 306 V 375 H 120 V 326 @ 670,367\nP2 -> P6 : answer ~ M 220 278 H 500 V 190 H 540 @ 350,266\nP9 -> Q2\nQ2 -> P5 : yes ~ M 1395 146 V 405 H 220 V 716 H 250 @ 228,560\nQ2 -> P4 : no ~ M 1395 146 V 405 H 365 V 470 @ 375,440\nP4 -> P7 : claim\nP7 -> P8 : open MR\nP8 -> Q1\nQ1 -> O3 : yes\n"}], "stories": [{"text": "Someone sends an idea; we ask a question; they answer", "fit": "1111", "path": "P1 P3 P6 P2 O2", "anti": false}, {"text": "We say no, with why", "fit": "1111", "path": "P3 P6 O2 P2", "anti": false}, {"text": "We approve it, and it's up for grabs on the claim board", "fit": "1111", "path": "P6 O1 g unapproved work.", "chk": "Approve a request, claim its work item, and confirm another volunteer sees it as taken.", "l": ["P9", "P9", "P9", "P9 Q2 P4 P5 P7"]}, {"text": "Requesters can find status, reasons and answers", "src": "S1–S2, My requests", "f": "yyyy", "star": false, "why": "Requesters should not have to repeat the conversation in chat.", "chk": "Ask for information, receive an answer, change status, and confirm the requester sees why.", "l": ["P2 O2", "P2 O2", "P2 O2", "P2 O2 P6"]}, {"text": "Fits the appetite", "src": "Frame", "f": "uuuu", "star": false, "why": "Rate each shape against the appetite you set.", "chk": "Estimate each shape's build against the appetite and cut line.", "l": ["", "", "", ""]}], "things": [{"name": "Request", "what": "An idea sent by anyone signed in with SSO", "where": "app", "seen": "made in P1 · answered in P2 · decided in P6"}, {"name": "Work item", "what": "An approved request, e.g. DWC-42", "where": "app", "seen": "made by O1 · seen in P4, P5, P7"}, {"name": "Claim", "what": "A volunteer's hold on a work item", "where": "app", "seen": "set from P4 (via Q2) · shown in P7"}, {"name": "Merge requests", "what": "App and BackEnd MRs naming the item", "where": "GitLab", "seen": "opened from P7 into P8 · merged by O3"}, {"name": "Person", "what": "SSO identity; planners-only gates P3", "where": "app", "seen": "signs in to everything in the app"}, {"name": "Status + email", "what": "What the requester is told, and why", "where": "app", "seen": "sent by O2 · read in P2"}], "slices": [], "drift": [], "rel": []};
const clone=o=>JSON.parse(JSON.stringify(o)),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const blank=()=>({schema_version:3,name:"New project",appetiteAuthority:"Unset",frameAuthority:"Working",problem:[],outcome:[],appetite:"",cut:"",slice:"",why:"",pick:null,options:[{id:"A",title:"Option A",promise:"",risk:"",cuts:"",placeholder:false,dsl:"P1 | place | First screen | what someone does first | app"}],stories:[],reqs:[],things:[],slices:[],drift:[],rel:[]});
function norm(m){
 if(!m || typeof m!=="object" || !Array.isArray(m.options) || !m.options.length || m.options.length>11)throw Error("Invalid board: options");
 for(const k of ["stories","reqs","things","slices","drift","rel","problem","outcome"]){if(!Array.isArray(m[k]))m[k]=[];if(m[k].length>200)throw Error("Too many "+k)}
 if(typeof m.name!=="string"||m.name.length>200)throw Error("Invalid project name");
 m.schema_version=3;m.appetiteAuthority=m.appetiteAuthority||"Unset";m.frameAuthority=m.frameAuthority||"Working";m.selectionAuthority=m.selectionAuthority||"Working";
 const used=new Set();
 m.options.forEach(o=>{if(!o||typeof o.dsl!=="string"||o.dsl.length>100000)throw Error("Invalid option");if(!/^(CURRENT|[A-J])$/.test(o.id)||used.has(o.id))throw Error("Duplicate or invalid option ID");used.add(o.id)});
 m.reqs.forEach((r,i)=>{if(!r||typeof r.text!=="string")throw Error("Invalid requirement");r.id=r.id||"R"+(i+1);r.status=r.status||(r.star?"Must-have":"Nice-to-have");r.auth=r.auth||"Working";r.f=(r.f||"").padEnd(m.options.length,"u").slice(0,m.options.length);r.l=Array.isArray(r.l)?r.l:[];r.part_refs=r.part_refs&&typeof r.part_refs==="object"?r.part_refs:{};while(r.l.length<m.options.length)r.l.push("")});

 m.stories.forEach((s,i)=>{s.id=/^S\d+$/.test(s.id||"")?"SC-"+s.id.slice(1):(s.id||"SC-"+(i+1));s.fit=(s.fit||"").padEnd(m.options.length,"0").slice(0,m.options.length);s.paths=s.paths&&typeof s.paths==="object"&&!Array.isArray(s.paths)?s.paths:{};if(s.path&&!Object.keys(s.paths).length){const source=m.options.find(o=>!o.placeholder)||m.options[0];s.paths[source.id]=s.path}});

function validateStatusReport(p,expectedSha,now=Date.now()){
 if(!p||p.schema_version!==1||p.kind!=="ShapingBoardProductStatus"||!["PASS","REVIEW","DRIFT"].includes(p.verdict))throw Error("Unrecognized gate report");
 if(!/^[0-9a-f]{40}$/i.test(p.revision||"")||p.revision.toLowerCase()!==expectedSha.toLowerCase())throw Error("Status revision does not match the current repository commit");
 const stamp=Date.parse(p.generated_at||"");
 if(!Number.isFinite(stamp)||stamp>now+300000||now-stamp>72*3600000)throw Error("Report is missing, future-dated or older than 72 hours");
 if(!Array.isArray(p.impacts)||p.impacts.length>500||p.impacts.some(x=>!x||!["PASS","REVIEW","DRIFT"].includes(x.status)||!Array.isArray(x.refs)||!Array.isArray(x.changed_paths)||!Array.isArray(x.scenarios)||x.scenarios.some(c=>!c||!["PASS","REVIEW","DRIFT"].includes(c.status))))throw Error("Invalid impact evidence");
 if(p.verdict==="PASS"&&(p.impacts.length===0||p.impacts.some(x=>x.status!=="PASS"||!x.scenarios.some(c=>c.status==="PASS"))||p.trusted_baseline_missing||p.bindings_changed||(p.unmapped_changed_paths||[]).length||(p.accepted_contract_changes||[]).length))throw Error("PASS without complete, covered scenario evidence");
 return p
}
function resetStatusFeed(){feedRuntime.seq++;feedRuntime.state="off";feedRuntime.error="";feedRuntime.checkedAt="";feedRuntime.projectId="";}
function checkFeedConfig(url,repo,ref){
 const u=new URL(url);
 if(u.protocol!=="https:"||u.username||u.password||u.search||u.hash)throw Error("Use a public HTTPS JSON URL without credentials or query strings");
 if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo))throw Error("Use a public GitHub repository: owner/repo");
 if(!/^[A-Za-z0-9._/-]+$/.test(ref)||ref.includes(".."))throw Error("Invalid GitHub branch");
 return {url:u.href,repo,ref};
}
async function refreshStatusFeed(){
 const projectId=M.project_id,config=M.status_feed,seq=++feedRuntime.seq;
 feedRuntime.projectId=projectId;feedRuntime.error="";feedRuntime.checkedAt="";M.product_status=null;
 if(!config){feedRuntime.state="off";render();return}
 feedRuntime.state="checking";render();
 try{
  checkFeedConfig(config.url,config.repo,config.ref);
  const api="https://api.github.com/repos/"+config.repo+"/commits/"+encodeURIComponent(config.ref);
  const responses=await Promise.all([fetch(api,{credentials:"omit",cache:"no-store"}),fetch(config.url,{credentials:"omit",cache:"no-store"})]);
  if(responses.some(x=>!x.ok))throw Error("Repository revision or HTTPS report unavailable (check public access and CORS)");
  const raw=await responses[1].text();if(raw.length>1024*1024)throw Error("Report exceeds 1 MB");
  const head=await responses[0].json();
  if(!/^[0-9a-f]{40}$/i.test(head.sha||""))throw Error("GitHub revision unavailable");
  const report=validateStatusReport(JSON.parse(raw),head.sha);
  if(!report.product||report.product.trim().toLowerCase()!==M.name.trim().toLowerCase())throw Error("Report product does not match this board project");
  if(seq!==feedRuntime.seq||projectId!==M.project_id)return;
  M.product_status=report;feedRuntime.state="current";feedRuntime.checkedAt=new Date().toISOString();
 }catch(error){
  if(seq!==feedRuntime.seq||projectId!==M.project_id)return;
  M.product_status=null;feedRuntime.state="unavailable";feedRuntime.error=String(error.message||error);
