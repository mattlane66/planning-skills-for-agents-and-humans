 g.nodes.forEach((x,ix)=>{x.part=o.id+(ix+1);if(x.k==="place"){m[x.i]="P"+ ++p;pl.push(x);x.r.forEach(r=>ui.push({id:"U"+ ++u,pl:m[x.i],x,row:r,out:[]}))}
  else if(x.k==="store"){m[x.i]="S"+ ++s;st.push(x)}else if(x.k==="question"){m[x.i]="BR"+(br.push(x));}else{m[x.i]="N"+ ++n;nu.push(Object.assign(x,{id:"N"+n,out:[]}))}});
 g.edges.forEach(e=>{const A=g.nodes.find(x=>x.i===e.a),B=g.nodes.find(x=>x.i===e.b);if(!A||!B)return;const w="→ "+m[e.b];
  if(A.k==="place"){const r=ui.filter(y=>y.x===A);const r1=r.find(y=>e.l&&y.row.toLowerCase().includes(e.l.toLowerCase()))||r[0];if(r1)r1.out.push(w)}else{A.out=A.out||[];A.out.push(w)}});
 return{g,m,pl,ui,nu,st,br}}
function bbMd(o,mode){const{g,m,pl,ui,nu,st,br}=bbMap(o),T2=(h,rows)=>"| "+h.join(" | ")+" |\n|"+h.map(()=>"---").join("|")+"|\n"+(rows.length?rows.map(r=>"| "+r.map(cell).join(" | ")+" |").join("\n"):"| "+h.map(()=>"none").join(" | ")+" |"),w=a=>a&&a.length?a.join(", "):"—",tr=ids(M.stories.map(s=>s).length?"":"");
 const traces=M.stories.filter(s=>s.path).map(s=>{const p=ids(s.path).map(i=>m[i]).filter(Boolean);const first=ui.find(y=>y.pl===p[0])||{id:p[0]||"—"};return[s.text,first.id,p.join(" -> ")||"—","—","—",p[p.length-1]||"—","from the board's story path"]});
 return`---
planning: true
artifact_type: breadboard
mode: ${mode}
status: draft
source_of_truth: false
feeds: []
---

# ${M.name} — Breadboard ${o.id}

## Mode and authority

- Mode: \`${mode}\`
- Requirements authority: Working
- Appetite authority: ${M.appetite?"Working":"Unset"}
- Candidate shape: ${o.id} — ${cell(o.title)}
- Evidence: exported from the shaping board; candidate evidence only, not build scope${o.placeholder?"; this option is a placeholder sketch, not from real evidence":""}

## Places

${T2(["ID","Authority","Shape part","Place","Description"],pl.map(x=>[m[x.i],"candidate",x.part,x.t,x.s||"not recorded"]))}

## UI Affordances

${T2(["ID","Place","Authority","Shape part","Component","Affordance","Control","Wires Out","Returns To"],ui.map(y=>[y.id,y.pl,"candidate",y.x.part,y.x.t,y.row,"click",w(y.out),"—"]))}

## Non-UI Affordances

${T2(["ID","Place","Authority","Shape part","Component","Affordance","Control","Wires Out","Returns To"],nu.map(x=>[x.id,"—","candidate",x.part,x.s||"system",x.t+(x.r.length?": "+x.r.join("; "):""),"call",w(x.out),"—"]))}

## Stores

${T2(["ID","Place","Authority","Shape part","Store","Description"],st.map(x=>[m[x.i],"—","candidate",x.part,x.t,x.r.join("; ")||"not recorded"]))}

## Product-relevant branches

${T2(["Branch","Trigger","User-visible consequence","Shape part","Status"],br.map(x=>[x.t,"decision point in the flow",g.edges.filter(e=>e.a===x.i).map(e=>(e.l||"next")+" → "+(m[e.b]||e.b)).join("; ")||"not recorded",x.part,"supported"]))}

## Behavior traces

${T2(["Scenario","Entry","Control path","Decision / branch","State / data effect","Observable consequence","Evidence or status"],traces)}
`}
function planningFiles(){const o=M.options.find(x=>x.id===M.pick)||M.options[0],st=M.reqs.filter(r=>r.star),A=M.options,mk=c=>c==="y"?"✅":c==="n"?"❌":"❓";
 const frame=`---

 const shaping=`---
planning: true
artifact_type: shaping

feeds:
  - breadboard
---

# ${M.name} — Shaping

## Working mode

${"| ID | Requirement | Status | Authority | Origin | Evidence refs | Notes |\n|---|---|---|---|---|---|---|\n"+(M.reqs.map((r,i)=>"| "+[RID(i),r.text,r.star?"Must-have":"Nice-to-have",r.auth||"Working",r.src,r.chk?"check: "+r.chk:"",r.why].map(cell).join(" | ")+" |").join("\n")||"| R0 | not recorded | Core goal | Working | not recorded | not recorded | not recorded |")}

## Appetite

- Authority: ${M.appetite?"Working":"Unset"}

- Cut line: ${cell(M.cut)}
- Current slice: ${cell(M.slice)}

## Shapes

${A.map(x=>{const g=parse(x.dsl);return`### ${x.id}: ${cell(x.title)}\n\n| Part | Mechanism | Flag |\n|---|---|:---:|\n${g.nodes.map((n,i)=>"| "+x.id+(i+1)+" | "+cell((n.k==="place"?"Place":n.k==="action"?"Action":n.k==="store"?"Store":"Branch")+": "+n.t+(n.r.length?" — "+n.r.join("; "):""))+" | "+(x.placeholder?"⚠️":"")+" |").join("\n")||"| "+x.id+"1 | not recorded | |"}\n`}).join("\n")}
## Fit check

- Authority: Working
- Evaluation altitude: Design conformance

${"| Req | Requirement | Status | "+A.map(x=>x.id).join(" | ")+" |\n|---|---|---|"+A.map(()=>":---:|").join("")+"\n"+(M.reqs.map((r,i)=>"| "+[RID(i),r.text,r.star?"Must-have":"Nice-to-have",...[...r.f].map(mk)].map(cell).join(" | ")+" |").join("\n")||"| R0 | not recorded | Core goal | "+A.map(()=>"❓").join(" | ")+" |")}

✅ modeled in the candidate, not verified · ❌ conflict shown · ❓ open. A placeholder option (⚠️) is a sketch, not real evidence.

## Reverse fit check

${"| Shape part | Mechanism | Requirement(s) served | Justified? |\n|---|---|---|:---:|\n"+(()=>{const g=parse(o.dsl),rows=g.nodes.map((n,i)=>{const s=M.reqs.map((r,ri)=>ids(r.l[A.indexOf(o)]).includes(n.i)?RID(ri):"").filter(Boolean);return["| "+o.id+(i+1),cell(n.t),s.join(", ")||"none recorded",s.length?"✅":"❓"]});return rows.map(r=>r.join(" | ")+" |").join("\n")||"| "+o.id+"1 | not recorded | none recorded | ❓ |"})()}

## Decision

- Status: ${M.pick?"decision-ready":"exploring"}
- Chosen direction: ${M.pick?M.pick+" — "+cell(o.title)+" (provisional human choice recorded on the board; not yet accepted in shaping)":"not chosen yet"}
- Why: ${cell(M.why)}
- Rejected directions: ${M.pick?A.filter(x=>x!==o).map(x=>x.id+" — "+cell(x.risk)).join("; ")||"none":"none yet"}
- Cuts / non-goals: ${cell(M.pick?o.cuts:M.cut)}
`;
 const f=[["planning/01-frame.md",frame],["planning/02-shaping.md",shaping],["planning/03-breadboard-"+o.id+".md",bbMd(o,"candidate-shape")]];
 if(M.slices.length)f.push(["planning/04-slices.md",`---\nplanning: true\nartifact_type: slices\nstatus: draft\n---\n\n# ${M.name} — Slices\n\n## Slice inventory\n\n| Slice | Name | Included affordances / stores | Demo | Produces | Dependencies | Unknowns |\n|---|---|---|---|---|---|---|\n${M.slices.map((s,i)=>"| V"+(i+1)+" | "+[s.name,s.stories?"stories "+s.stories:"not recorded","not recorded","not recorded","none","not recorded"].map(cell).join(" | ")+" |").join("\n")}\n`]);
 return f}

function addOpt(){const id=[...L].find(c=>!M.options.some(o=>o.id===c));if(!id)return;M.options.push({id,title:"Option "+id,promise:"",risk:"",cuts:"",placeholder:false,dsl:""});M.stories.forEach(s=>s.fit+="0");M.reqs.forEach(r=>{r.f+="u";r.l.push("")});T.opt=M.options.length-1}
function delOpt(){if(M.options.length<2)return;const i=T.opt,o=M.options[i],cut=s=>s.slice(0,i)+s.slice(i+1);M.options.splice(i,1);M.stories.forEach(s=>s.fit=cut(s.fit));M.reqs.forEach(r=>{r.f=cut(r.f);r.l.splice(i,1)});if(M.pick===o.id)M.pick=null;T.opt=0}
function act(a){const k=M.options.findIndex(o=>o.id===M.pick);
 if(a==="imp"){$("#imp").click();return false}
 if(a==="exp"){dl(slug()+".board.json",JSON.stringify(M,null,2),"application/json");return false}
 if(a==="md"){dl(slug()+"-shape.md",notes(),"text/markdown");return false}
 if(a==="zip"){dl(slug()+"-planning.zip",zip(planningFiles()),"application/zip");return false}
 if(a==="copy"){try{navigator.clipboard.writeText(notes());T.msg="Copied"}catch(_){T.msg="Copy blocked here; use Download"}}
 if(a==="new"){T.undo=clone(M);M=norm(blank());T.top="shape";T.sub="board";T.opt=0;T.story=T.rq=null}
 if(a==="ex"){T.undo=clone(M);M=norm(clone(E));T.top="shape";T.sub="board";T.opt=0;T.story=T.rq=null}
 if(a==="undo"&&T.undo){M=T.undo;T.undo=null;T.opt=0;T.story=T.rq=null}
 if(a==="seed"&&k>=0)parse(M.options[k].dsl).nodes.forEach(n=>{const it=n.i+" · "+n.t;if(!M.drift.some(r=>r.item===it))M.drift.push({item:it,intent:n.k+(n.r.length?": "+n.r.join("; "):""),reality:"",status:"not checked"})});
 if(a==="seed"&&k<0)T.msg="Select a direction first";
 if(a==="sync")[...M.reqs].sort((x,y)=>y.star-x.star).forEach(r=>{if(!M.rel.some(x=>x.req===r.text))M.rel.push({req:r.text,check:r.chk||"",status:"not verified",evidence:""})});
 return true}
document.addEventListener("click",e=>{const t=e.target.closest("[data-top],[data-sub],[data-view],[data-opt],[data-addopt],[data-delopt],[data-story],[data-dot],[data-star],[data-rq],[data-rate],[data-pick],[data-add],[data-del],[data-z],[data-act],[data-addreq]");if(!t)return;const d=t.dataset;T.msg="";
 if(d.top)T.top=d.top;if(d.sub)T.sub=d.sub;if(d.view)T.view=d.view;if(d.opt!==undefined)T.opt=+d.opt;
 if(d.addopt!==undefined)addOpt();if(d.delopt!==undefined)delOpt();
 if(d.story!==undefined)T.story=T.story===+d.story?null:+d.story;
 if(d.dot){const[i,j]=d.dot.split(",").map(Number),s=M.stories[i],c="10x"[("10x".indexOf(s.fit[j])+1)%3];s.fit=s.fit.slice(0,j)+c+s.fit.slice(j+1)}
 if(d.star!==undefined)M.reqs[+d.star].star=!M.reqs[+d.star].star;
 if(d.rq!==undefined)T.rq=T.rq===+d.rq?null:+d.rq;
 if(d.rate){const[i,j]=d.rate.split(",").map(Number),r=M.reqs[i],c="ypnu"[("ypnu".indexOf(r.f[j])+1)%4];r.f=r.f.slice(0,j)+c+r.f.slice(j+1)}
 if(d.pick)M.pick=M.pick===d.pick?null:d.pick;
 if(d.add)M[d.add].push(TPL[d.add]());
 if(d.del){const[k,i]=d.del.split(".");M[k].splice(+i,1);if(k==="reqs")T.rq=null;if(k==="stories")T.story=null}
 if(d.z)T.zm=Math.max(.5,Math.min(2,T.zm+.25*d.z));
 if(d.addreq!==undefined&&T.nr.trim()){const n=M.options.length;M.reqs.push({id:"R"+(Math.max(0,...M.reqs.map(r=>+(r.id||"").replace(/\D/g,"")||0))+1),status:"Undecided",auth:"Working",text:T.nr.trim(),src:"",why:"",chk:"",star:false,f:"u".repeat(n),l:Array(n).fill("")});T.nr=""}
 if(d.act&&!act(d.act))return;save();render()});
document.addEventListener("input",e=>{const el=e.target,d=el.dataset;if(d.nr!==undefined){T.nr=el.value;return}
 if(el.type==="checkbox"||el.tagName==="SELECT")return;
 if(d.l){M[d.l]=el.value.split("\n").map(s=>s.trim()).filter(Boolean);save();return}
 if(d.p){set(d.p,el.value);save();if(/\.(dsl|path|l\.\d+)$/.test(d.p))renderDia()}});
