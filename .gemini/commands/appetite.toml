description = "Set, revise, or accept the bounded time or scope budget and cut line without forcing a fixed shaping sequence."

prompt = """
Use this repository's planning instructions and shaping skill.

Primary instructions:
@{AGENTS.md}
@{shaping/SKILL.md}
@{docs/human-decision-gates.md}
@{templates/appetite-card.md}

Command arguments / source context:
{{args}}

Task: work on Appetite for the current shaping move.

In collaborative mode, Appetite may be `Working` before it becomes `Accepted`, and candidate shapes may already exist. In gated/orchestrated mode, enforce `.agent-orchestration.yaml` prerequisites.

Record authority, budget, team shape and review point, cut line, accepted uncertainty, must-resolve unknowns, and revisit conditions.

Treat Appetite as a constraint on selection, not as an estimate reverse-engineered from a preferred shape. Existing candidates may expose what a tentative budget would force you to cut, but they do not determine the budget automatically.

Do not select a direction, promote candidate evidence, or write production code.

End by naming the smallest next useful shaping move: revise R, revise S, fit-check, spike, candidate breadboard, accept/revisit Appetite, or prepare selection.
"""
