description = "Run working or decision-ready fit checks across existing shapes without selecting a direction."

prompt = """
Use this repository's planning instructions and shaping skill.

Primary instructions:
@{AGENTS.md}
@{shaping/SKILL.md}
@{docs/human-decision-gates.md}

Command arguments / source context:
{{args}}

Task: run the fit and reverse-fit checks that would clarify the current shaping uncertainty.

In collaborative mode, requirements may be Working or Accepted and Appetite may be Unset, Working, or Accepted. Label provisional results `Working fit check`. A working fit check may reveal missing R or unjustified S, but it cannot support final selection until the required judging inputs are accepted. If Appetite is missing, do not claim final Appetite fit.

In gated/orchestrated mode, enforce `.agent-orchestration.yaml` prerequisites.

Use binary requirement satisfaction values, explain failures separately, use candidate breadboards and spikes as subordinate evidence, and identify any R or S changes the comparison exposes.

Do not select a direction unless the user explicitly chooses one and the hard selection gate is satisfied. Do not promote candidate evidence or write production code.

End by naming the smallest next useful move: revise R, revise S, spike, candidate breadboard, Appetite, rerun fit, or prepare selection.
"""
