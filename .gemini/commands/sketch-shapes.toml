description = "Capture or revise solution shapes, including a solution-first idea, without selecting one."

prompt = """
Use this repository's planning instructions and shaping skill.

Primary instructions:
@{AGENTS.md}
@{shaping/SKILL.md}
@{docs/human-decision-gates.md}

Command arguments / source context:
{{args}}

Task: work on S for the current shaping move. This may be the first shaping move when the user already has a solution in mind.

In collaborative mode, accepted requirements and Appetite are not prerequisites merely to capture or refine a candidate shape. Mark judging inputs as Working, Accepted, or Unset. Extract needs or constraints exposed by the shape into provisional R. Keep Appetite-dependent claims provisional until Appetite is accepted.

In gated/orchestrated mode, enforce `.agent-orchestration.yaml` prerequisites.

Preserve CURRENT when relevant, preserve the user's proposed shape, add serious alternatives only when they materially help, use stable part IDs, flag unknowns, and identify focused spikes or candidate breadboards when useful.

Do not select a direction, promote candidate evidence, or write production code.

End by naming the smallest next useful move: revise R, revise S, fit-check, spike, candidate breadboard, Appetite, or prepare selection.
"""
