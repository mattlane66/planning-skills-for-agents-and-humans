description = "Create, extract, or revise requirements / criteria without requiring solution exploration to stop."

prompt = """
Use this repository's planning instructions and shaping skill.

Primary instructions:
@{AGENTS.md}
@{shaping/SKILL.md}
@{docs/human-decision-gates.md}

Command arguments / source context:
{{args}}

Task: work on the requirements / criteria portion of the shaping artifact for the current move.

Requirements may come from a problem statement, research, an existing solution shape, a prototype, a fit failure, or a spike. When extracting R from S, restate the underlying need or constraint independently of the mechanism.

Include stable requirement IDs, status, Working/Accepted authority when known, and useful source notes.

Do not delete or suppress existing shapes merely because this move focuses on R. Do not silently change accepted requirements; propose the delta and stop for the human decision.

This command is a focused move inside a fluid shaping loop, not proof that criteria had to come before S.

Do not select a direction, promote candidate evidence, or write production code.

End by naming the smallest next useful move: revise S, fit-check, spike, candidate breadboard, Appetite, or accept/revise R.
"""
